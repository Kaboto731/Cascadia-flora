[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascadia-flora"
version = "0.1.0"
description = "Open-data pipeline and species distribution modeling for Pacific Northwest trees"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }  # TODO: confirm your license choice
authors = [{ name = "Your Name" }]  # TODO: replace

# Core dependencies: enough for Week 1 (GBIF ingestion + bronze Parquet)
dependencies = [
    "pygbif>=0.6",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Weeks 2-3: spatial enrichment (rasters, H3, STAC)
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2023.1",
    "h3>=4.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
]

# Weeks 2-3: orchestration and transformation
pipeline = [
    "dbt-core>=1.8",   # 1.8+ is required for dbt unit tests
    "dbt-duckdb>=1.8",
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-dbt>=0.23",
]

# Weeks 4-5: modeling
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "matplotlib>=3.8",
]

# Week 6: dashboard
app = [
    "streamlit>=1.32",
    "pydeck>=0.8",
    "folium>=0.16",
    "plotly>=5.20",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

# Everything at once (may take a while to resolve)
all = ["cascadia-flora[geo,pipeline,ml,app,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that hit external APIs or process large files",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplifications
]

[tool.ruff.format]
quote-style = "double"
