version: 2

models:
  - name: fct_species_climate_summary
    description: >
      Climate niche summary per species: 5th, median and 95th percentile of annual mean
      temperature, annual precipitation and driest-quarter precipitation.
    columns:
      - name: species_name
        data_tests: [unique, not_null]

  - name: fct_species_lai_summary
    description: >
      Summer leaf area index around each species' records: 10th, median and 90th percentile,
      the share with LAI at all, and the share in open (LAI < 3) and dense (LAI >= 5) cover.
    columns:
      - name: species_name
        data_tests: [unique, not_null]
